[package]
name = "rescueforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Open-source file carving and undelete engine: signature scanning, NTFS/FAT/ext4 metadata recovery"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chukfinley/rescueforge"
keywords = ["data-recovery", "carving", "forensics", "ntfs", "undelete"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "rescueforge"
path = "src/lib.rs"

[[bin]]
name = "rescueforge"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
